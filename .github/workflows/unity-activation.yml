name: Request Unity CI activation file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
