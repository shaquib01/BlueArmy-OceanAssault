name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$UNITY_LICENSE" ]] || missing+=("UNITY_LICENSE")
          [[ -n "$UNITY_EMAIL" ]] || missing+=("UNITY_EMAIL")
          [[ -n "$UNITY_PASSWORD" ]] || missing+=("UNITY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          printf 'All three required Unity CI secrets are present. Secret values were not printed.\n'

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: BuildAndroid.Build
          versioning: Semantic

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueArmy-OceanAssault-Android-APK
          path: Builds/Android/BlueArmy-OceanAssault.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Blue Army: Ocean Assault ${{ github.ref_name }}"
          generate_release_notes: true
          files: Builds/Android/BlueArmy-OceanAssault.apk
